name: astro_vastu_report
description: Birth chart and Astro-Vastu PDF reports based on supplied bilingual reference guides.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  jyotish:
    path: packages/jyotish
  pdf: ^3.11.3
  printing: ^5.14.2
  intl: ^0.19.0
  timezone: ^0.9.4
  path_provider: ^2.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSansDevanagari-Regular.ttf
    - assets/ephe/seas_18.se1
    - assets/ephe/semo_18.se1
    - assets/ephe/sepl_18.se1
    - assets/licenses/
